# Epic 64: three invalid runs, then the agent stops and says what it could not do (no answer row).
id: unknown_field_repair
description: Unknown field three times -> stop after 3 attempts
persona: admin
script:
  - kind: tool_calls
    calls: [[semantic.run, {question: Average candidate age, definition: {source: candidates.candidate, measures: [{key: age, agg: avg, field: age}]}, viz: {type: kpi}}]]
  - kind: tool_calls
    calls: [[semantic.run, {question: Average candidate age, definition: {source: candidates.candidate, measures: [{key: age, agg: avg, field: date_of_birth}]}, viz: {type: kpi}}]]
  - kind: tool_calls
    calls: [[semantic.run, {question: Average candidate age, definition: {source: candidates.candidate, measures: [{key: age, agg: avg, field: birth_year}]}, viz: {type: kpi}}]]
  - kind: text
    text: I could not answer this -- there is no age field. The closest question I can answer is average experience in years.
expect:
  status: completed
  sequence: [[semantic.run, invalid, semantic_unknown_field], [semantic.run, invalid, semantic_unknown_field], [semantic.run, invalid, semantic_unknown_field]]
  answers: 0
