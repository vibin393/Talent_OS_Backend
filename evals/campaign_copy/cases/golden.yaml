- id: sms_golden_1
  description: DLT template, every variable within 30 chars
  channel: sms
  tags:
  - golden
  - sms
  template: &id003
    body: 'Hi {#var#}, new {#var#} roles near you. Apply: {#var#}. Reply STOP to opt
      out.'
    variables:
    - name
    - role
    - link_url
    url_variables:
    - link_url
  postings:
  - *id002
  result:
    segments:
    - key: seg_a
      variants:
      - template_values:
          name: there
          role: Java
          link_url: https://app.example.test/j/1
  expect:
    valid: true
