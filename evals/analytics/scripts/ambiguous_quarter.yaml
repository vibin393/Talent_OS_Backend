# Epic 64: an ambiguous period is answered with a stated assumption, stored on the answer.
id: ambiguous_quarter
description: This quarter -> assumption stored and shown
persona: admin
script:
  - kind: tool_calls
    calls:
      - - semantic.run
        - question: Interviews scheduled this quarter by status
          assumptions: ["I took 'this quarter' as Oct-Dec 2026"]
          definition:
            source: interviews.interview
            filters: {field: starts_at, op: between, value: ["2026-10-01T00:00:00+05:30", "2026-12-31T23:59:59+05:30"]}
            group_by: [{field: status}]
          viz: {type: bar, x: status}
  - kind: text
    text: No interviews are scheduled in Oct-Dec 2026.
expect:
  status: completed
  sequence: [[semantic.run, executed]]
  answers: 1
  answer:
    assumptions: ["I took 'this quarter' as Oct-Dec 2026"]
