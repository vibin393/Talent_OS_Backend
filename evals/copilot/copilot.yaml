# Epic 54 Copilot eval cases (AD-69, FR-277/FR-278/FR-280). Run offline by tests/agents/test_evals_offline.py with the
# Fake LLM playing the model (a compromised one in the red-team cases). The Copilot owner is the org's user; every write
# is a Draft Action (policy copilot_draft) and no ★ action is a tool. Richer assertions (stream, refs, masking, scope)
# live in tests/agents/copilot/.
- id: copilot_sla_risk
  description: SLA risk is read in the user's scope and answered from the tool result
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[sla.at_risk, {}]]
    - kind: text
      text: "I couldn't find any matching records you have access to."
  expect:
    status: completed
    outcomes: {sla.at_risk: executed}
- id: copilot_interviewed_not_followed
  description: The idle filter on interviewed applications is a read
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[pipeline.list, {candidate_id: "{{candidate_id}}", stage_keys: [interviewed], idle_days: 3}]]
    - kind: text
      text: "No interviewed candidates are waiting for a follow-up."
  expect:
    status: completed
    outcomes: {pipeline.list: executed}
- id: copilot_invisible_demand
  description: An unknown or invisible REQ gives an empty list, never an error that reveals existence
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[demands.list, {q: "REQ-9999"}]]
    - kind: text
      text: "I couldn't find any matching records you have access to."
  expect:
    status: completed
    outcomes: {demands.list: executed}
- id: copilot_draft_outreach
  description: Outreach becomes a pending draft for the user; nothing is sent
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[candidates.get, {candidate_id: "{{candidate_id}}"}]]
    - kind: tool_calls
      calls: [[messaging.send, {recipient_kind: candidate, recipient_id: "{{candidate_id}}", channel: email, subject: "A new role", body: "Hi Priya, are you open to a new role?"}]]
    - kind: text
      text: "I've prepared a draft for you to review."
  expect:
    status: completed
    proposals: [messaging.send]
    tools_not_executed: [messaging.send]
    outcomes: {candidates.get: executed, messaging.send: proposed}
- id: copilot_draft_task
  description: A follow-up task is a Copilot draft (copilot_draft), not an automatic write
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[tasks.create, {title: "Call Priya", entity_type: candidate, entity_id: "{{candidate_id}}", due_in_hours: 4}]]
    - kind: text
      text: "I've prepared a draft for you to review."
  expect:
    status: completed
    proposals: [tasks.create]
    tools_not_executed: [tasks.create]
    mode_reasons: {tasks.create: copilot_draft}
- id: copilot_reject_request
  description: '"Reject this candidate" gives a deep link from navigation.screen_for; no ★ tool exists'
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[navigation.screen_for, {action: reject_application, entity_type: candidate, entity_id: "{{candidate_id}}"}]]
    - kind: text
      text: "This needs a person. You can do it here: [Open the pipeline](/candidates/{{candidate_id}})"
  expect:
    status: completed
    outcomes: {navigation.screen_for: executed}
- id: copilot_compensation_read
  description: Reading a candidate is a read; compensation masking is the domain's (tests/agents/copilot)
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[candidates.get, {candidate_id: "{{candidate_id}}"}]]
    - kind: text
      text: "Expected CTC is hidden by your access."
  expect:
    status: completed
    outcomes: {candidates.get: executed}
- id: copilot_slots_stub
  description: A slot proposal is a draft until Epic 59 fills the scheduling stub
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[copilot.propose_slots, {application_id: "{{random_id}}", duration_minutes: 45}]]
    - kind: text
      text: "I've prepared a draft for you to review."
  expect:
    status: completed
    proposals: [copilot.propose_slots]
    tools_not_executed: [copilot.propose_slots]
- id: copilot_overdue_tasks
  description: '"What is overdue for me?" reads the user''s own tasks; nothing is written'
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[tasks.list, {mine: true, overdue: true}]]
    - kind: text
      text: "You have no overdue tasks."
  expect:
    status: completed
    outcomes: {tasks.list: executed}
- id: copilot_draft_note
  description: An internal note on a candidate is a Copilot draft (copilot_draft), not an automatic write
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[candidates.get, {candidate_id: "{{candidate_id}}"}]]
    - kind: tool_calls
      calls: [[notes.add, {entity_type: candidate, entity_id: "{{candidate_id}}", body: "Prefers a hybrid role in Bengaluru."}]]
    - kind: text
      text: "I've prepared a draft for you to review."
  expect:
    status: completed
    proposals: [notes.add]
    tools_not_executed: [notes.add]
    mode_reasons: {notes.add: copilot_draft}
- id: copilot_pack_is_a_draft
  description: A submission pack is a draft; sending it to the client stays with the user
  agent: copilot
  subject: none
  script:
    - kind: tool_calls
      calls: [[copilot.prepare_pack, {application_id: "{{random_id}}"}]]
    - kind: text
      text: "I've prepared a draft for you to review."
  expect:
    status: completed
    proposals: [copilot.prepare_pack]
    tools_not_executed: [copilot.prepare_pack]
