# Epic 55 (A10): a draft without a JD -> preview (bias flags returned) -> update_draft saves an AI JD version (auto).
demands_jd_generate:
  - kind: emit_result
    result: {content: "## Data Engineer\n\nWe want a young rockstar engineer for our Pune team."}
agent_demand:
  - kind: tool_calls
    calls: [[demands.preview_jd, {demand_id: "{{demand_id}}"}]]
  - kind: tool_calls
    calls: [[demands.update_draft, {demand_id: "{{demand_id}}", jd_content: "## Data Engineer\n\nYou will build data pipelines for our Pune team."}]]
  - kind: emit_result
    result: {outcome: done, summary: "Saved a JD draft."}
