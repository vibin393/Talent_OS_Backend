# Epic 64 Analytics Evaluation Set -- placements (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: pl_by_client_fy
  persona: admin
  question: Placements by client this financial year
  expected:
    definition:
      source: placements.placement
      filters:
        field: planned_start_date
        op: between
        value: &id001
        - '2026-04-01'
        - '2027-03-31'
      group_by:
      - field: client.name
      measures:
      - &id002
        key: n
        agg: count
      sort:
      - key: n
        desc: true
    viz:
      type: bar
      x: client.name
      value: n
  tags:
  - by_client
  - fy
- id: pl_by_client_fy_month_bill
  persona: admin
  question: Placements by client by FY month with total bill rate
  expected:
    definition:
      source: placements.placement
      filters:
        field: planned_start_date
        op: between
        value: *id001
      group_by:
      - field: client.name
      - field: planned_start_date
        bucket: month
      measures:
      - *id002
      - key: bill
        agg: sum
        field: bill_rate
    viz:
      type: bar
      x: planned_start_date
      value: n
      series: client.name
  tags:
  - by_client
  - fy
  - compensation
- id: pl_active_count
  persona: admin
  question: How many active placements do we have?
  expected:
    definition:
      source: placements.placement
      filters:
        field: status
        op: eq
        value: active
      measures:
      - *id002
    viz:
      type: kpi
      value: n
  tags:
  - kpi
