# Epic 64: filtering by a compensation field without compensation:view is refused (never executed), then repaired.
id: forbidden_filter
description: semantic_field_forbidden -> validate shows the path -> repaired definition executes
persona: recruiter
script:
  - kind: tool_calls
    calls:
      - - semantic.run
        - question: Placements with a bill rate above 100 by client
          definition:
            source: placements.placement
            filters: {field: bill_rate, op: gt, value: 100}
            group_by: [{field: client.name}]
          viz: {type: bar, x: client.name}
  - kind: tool_calls
    calls:
      - - semantic.validate
        - definition:
            source: placements.placement
            filters: {field: bill_rate, op: gt, value: 100}
            group_by: [{field: client.name}]
          viz: {type: bar, x: client.name}
  - kind: tool_calls
    calls:
      - - semantic.run
        - question: Placements by client
          definition:
            source: placements.placement
            group_by: [{field: client.name}]
          viz: {type: bar, x: client.name}
  - kind: text
    text: I cannot filter by bill rate with your access; here are your placements by client.
expect:
  status: completed
  sequence: [[semantic.run, invalid, semantic_field_forbidden], [semantic.validate, executed], [semantic.run, executed]]
  answers: 1
