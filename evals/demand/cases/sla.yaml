# Epic 55 SLA-risk Evaluation Set (FR-284): the deterministic projection rules.
# kind ``interval``: p_late from the time-to-fill p20 / p80 interval vs the due day count (threshold 0.60).
# kind ``pipeline``: the pipeline-only rules (no time-to-fill model) -> the milestones at risk.
- id: sla_interval_comfortably_on_time
  kind: interval
  due_days: 60
  p20: 20
  p80: 35
  expect: {at_risk: false}
- id: sla_interval_likely_late
  kind: interval
  due_days: 20
  p20: 25
  p80: 45
  expect: {at_risk: true}
- id: sla_interval_borderline_below
  kind: interval
  due_days: 35
  p20: 25
  p80: 45
  expect: {at_risk: false}
- id: sla_interval_borderline_above
  kind: interval
  due_days: 30
  p20: 25
  p80: 45
  expect: {at_risk: true}
- id: sla_pipeline_no_submissions
  kind: pipeline
  elapsed: {first_submission: 55}
  counts: {submissions: 0, interviews: 0, applications: 9, positions: 3}
  expect: {milestones: [first_submission]}
- id: sla_pipeline_no_interviews
  kind: pipeline
  elapsed: {first_interview: 70}
  counts: {submissions: 4, interviews: 0, applications: 20, positions: 2}
  expect: {milestones: [first_interview]}
- id: sla_pipeline_thin_funnel
  kind: pipeline
  elapsed: {assignment: 45}
  counts: {submissions: 0, interviews: 0, applications: 2, positions: 2}
  expect: {milestones: [assignment]}
- id: sla_pipeline_healthy
  kind: pipeline
  elapsed: {first_submission: 30, first_interview: 20}
  counts: {submissions: 2, interviews: 1, applications: 15, positions: 2}
  expect: {milestones: []}
