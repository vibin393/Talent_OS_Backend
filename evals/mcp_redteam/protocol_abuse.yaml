id: mcp_protocol_abuse
description: A batch array, a 300 KB body, an unsupported version, a bad Origin and a missing session id get the specified errors.
steps:
  - do: raw
    body: '[{"jsonrpc":"2.0","id":1,"method":"ping"}]'
    expect: {http: 400, rpc_error: -32600}
  - do: raw
    oversize: 300000
    expect: {http: 413}
  - do: initialize
    version: "2024-11-05"
    expect: {rpc_error: -32602}
  - do: raw
    body: '{"jsonrpc":"2.0","id":2,"method":"ping"}'
    headers: {Origin: "https://evil.example"}
    expect: {http: 403}
  - do: raw
    body: '{"jsonrpc":"2.0","id":3,"method":"ping"}'
    no_session: true
    expect: {http: 400}
