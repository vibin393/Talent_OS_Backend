# Epic 64 Analytics Evaluation Set -- demands (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: dm_open_by_priority_status
  persona: admin
  question: Open demands by priority and status
  expected:
    definition:
      source: demands.demand
      filters:
        field: status
        op: in
        value:
        - open
        - on_hold
      group_by:
      - field: priority
      - field: status
      measures:
      - &id001
        key: n
        agg: count
    viz:
      type: pivot
      x: priority
      value: n
      series: status
  tags:
  - pivot
- id: dm_open_by_client
  persona: admin
  question: Open demands by client
  expected:
    definition:
      source: demands.demand
      filters:
        field: status
        op: eq
        value: open
      group_by:
      - field: client.name
      measures:
      - *id001
      sort:
      - key: n
        desc: true
    viz:
      type: bar
      x: client.name
      value: n
  tags:
  - by_client
- id: dm_positions_fill_ratio
  persona: admin
  question: Fill ratio of positions by client
  expected:
    definition:
      source: demands.demand
      group_by:
      - field: client.name
      measures:
      - key: filled
        agg: sum
        field: positions_filled
      - key: positions
        agg: sum
        field: positions
      - key: fill_ratio
        agg: ratio
        of:
        - filled
        - positions
    viz:
      type: bar
      x: client.name
      value: fill_ratio
  tags:
  - ratio
- id: dm_by_work_mode_pct
  persona: admin
  question: Share of demands by work mode
  expected:
    definition:
      source: demands.demand
      group_by:
      - field: work_mode
      measures:
      - key: share
        agg: pct_of_total
    viz:
      type: pie
      x: work_mode
      value: share
  tags:
  - pct_of_total
- id: dm_opened_per_month_fy
  persona: admin
  question: Demands opened per month this FY
  expected:
    definition:
      source: demands.demand
      filters:
        field: opened_at
        op: between
        value:
        - '2026-04-01T00:00:00+05:30'
        - '2027-03-31T23:59:59+05:30'
      group_by:
      - field: opened_at
        bucket: month
      measures:
      - *id001
    viz:
      type: line
      x: opened_at
      value: n
  tags:
  - fy
  - time_series
- id: dm_by_owner
  persona: admin
  question: Open demands by recruiter
  expected:
    definition:
      source: demands.demand
      filters:
        field: status
        op: eq
        value: open
      group_by:
      - field: owner_id
      measures:
      - *id001
    viz:
      type: bar
      x: owner_id
      value: n
  tags:
  - by_recruiter
- id: dm_total_positions
  persona: admin
  question: Total open positions
  expected:
    definition:
      source: demands.demand
      filters:
        field: status
        op: eq
        value: open
      measures:
      - key: positions
        agg: sum
        field: positions
    viz:
      type: kpi
      value: positions
  tags:
  - kpi
- id: dm_avg_bill_rate_masked
  persona: recruiter
  question: Average bill rate of open demands
  expected:
    definition:
      source: demands.demand
      filters:
        field: status
        op: eq
        value: open
      measures:
      - key: bill
        agg: avg
        field: bill_rate
    viz:
      type: kpi
      value: bill
  tags:
  - masked
  - compensation
- id: dm_top10_submissions
  persona: admin
  question: Top 10 demands by number of submissions
  expected:
    definition:
      source: demands.demand
      group_by:
      - field: title
      measures:
      - key: subs
        agg: sum
        field: submissions_count
      sort:
      - key: subs
        desc: true
    viz:
      type: bar
      x: title
      value: subs
  tags:
  - top_n
- id: dm_this_month_created
  persona: admin
  question: Demands created this month by employment type
  expected:
    definition:
      source: demands.demand
      filters:
        field: created_at
        op: between
        value:
        - '2026-10-01T00:00:00+05:30'
        - '2026-10-31T23:59:59+05:30'
      group_by:
      - field: employment_type
      measures:
      - *id001
    viz:
      type: bar
      x: employment_type
      value: n
  tags:
  - this_month
- id: dm_closing_soon
  persona: admin
  question: Demands with a target closure in the next 14 days
  expected:
    definition:
      source: demands.demand
      filters:
        and:
        - field: target_closure_date
          op: within_days
          value:
            days: 14
            direction: future
        - field: status
          op: eq
          value: open
      fields:
      - req_id
      - title
      - client.name
      - target_closure_date
    viz:
      type: table
  tags:
  - list
- id: dm_ambiguous_open
  persona: admin
  question: How many jobs do we have?
  expected:
    clarify: true
  tags:
  - ambiguity
  - clarify
