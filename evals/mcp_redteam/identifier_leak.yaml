id: mcp_identifier_leak
description: PAN, Aadhaar, passport and IFSC values in free text never reach the client.
seed:
  notes:
    - {kind: note, body: "KYC: PAN ABCDE1234F, Aadhaar 2345 6789 0123, passport K1234567, IFSC HDFC0001234."}
steps:
  - do: call
    tool: activities__list
    args: {entity_type: candidate, entity_id: "{candidate_id}"}
    expect: {is_error: false, text_not_contains: ["ABCDE1234F", "2345 6789 0123", "K1234567", "HDFC0001234"], text_contains: ["[redacted]"]}
  - do: session_status
    expect: {min_redactions: 4}
