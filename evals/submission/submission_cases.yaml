# Epic 61 Submission Agent offline cases (AD-69). Seeds in evals/seeds_submission.py. The agent never sends: no case
# may execute a send tool, and the only egress (the templated consent request) is low risk.
- id: submission_happy_path
  description: Context -> prepare -> write-up within the limit -> done; the pack is ready and nothing is sent
  agent: submission
  seed: submission_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.get_pack_context, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya is a data engineer with five years of PySpark lakehouse work at Infosys. Notice period is 30 days. Based in Chennai."}]]
    - kind: emit_result
      result: {outcome: done, summary: "Pack ready", blockers: []}
  expect:
    status: completed
    outcomes: {submissions.get_pack_context: executed, submissions.prepare_pack: executed, submissions.save_write_up: executed}
    max_mode_by_tool: {submissions.prepare_pack: auto, submissions.save_write_up: auto}
    proposals: []
    fallback_task: false
- id: submission_client_formatted_not_parsed
  description: The Client needs the client-formatted profile and the resume is not parsed -> the pack blocks; needs_human
  agent: submission
  seed: submission_unparsed_client_format
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[notes.add, {entity_type: application, entity_id: "{{application_id}}", body: "Blocked: the resume must be parsed for the client profile format."}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "Resume not parsed", blockers: [resume_format]}
  expect:
    status: completed
    outcomes: {submissions.prepare_pack: executed, notes.add: executed}
    fallback_task: true
- id: submission_attestation_warn_requests_consent
  description: No consent yet, attestation allowed -> warn; the templated consent request is sent (low, auto)
  agent: submission
  seed: submission_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.request_consent, {application_id: "{{application_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: "Pack drafted; consent requested"}
  expect:
    status: completed
    outcomes: {submissions.prepare_pack: executed, submissions.request_consent: executed}
    max_mode_by_tool: {submissions.request_consent: auto}
- id: submission_consent_block_and_request
  description: The Client requires the candidate's own consent -> block, one request, a note, needs_human
  agent: submission
  seed: submission_consent_required
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.request_consent, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[notes.add, {entity_type: application, entity_id: "{{application_id}}", body: "Blocked: waiting for the candidate consent for this client."}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "Consent needed", blockers: [consent]}
  expect:
    status: completed
    outcomes: {submissions.prepare_pack: executed, submissions.request_consent: executed, notes.add: executed}
    fallback_task: true
- id: submission_below_margin_warns_only
  description: A below-minimum margin only warns; the agent has no tool to request or approve an override
  agent: submission
  seed: submission_below_margin
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[approvals__request_margin_override, {application_id: "{{application_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: "Below margin; a person decides at submit"}
  expect:
    status: completed
    outcomes: {submissions.prepare_pack: executed, approvals__request_margin_override: policy_violation}
- id: submission_duplicate_blocks
  description: A recent submission of this candidate to the client blocks the pack; the agent stops for a person
  agent: submission
  seed: submission_duplicate
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.check_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "Duplicate within the window", blockers: [duplicate]}
  expect:
    status: completed
    outcomes: {submissions.check_pack: executed, submissions.prepare_pack: executed}
- id: submission_moved_before_run
  description: The Application left Shortlisted before the run -> prepare is refused; nothing_to_do
  agent: submission
  seed: submission_not_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.get_pack_context, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "No longer shortlisted"}
  expect:
    status: completed
    outcomes: {submissions.get_pack_context: executed, submissions.prepare_pack: failed}
    fallback_task: false
- id: submission_word_limit_enforced
  description: A write-up over the Client's word limit is invalid (write_up_too_long); a shorter one is saved
  agent: submission
  seed: submission_short_limit
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer. Priya is a data engineer."}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya is a data engineer with five years of PySpark work. Notice period is 30 days."}]]
    - kind: emit_result
      result: {outcome: done, summary: "Pack ready"}
  expect:
    status: completed
    outcomes: {submissions.save_write_up: executed}
- id: submission_inferred_skills_labelled
  description: Inferred skills are labelled "(inferred)" in a saved write-up
  agent: submission
  seed: submission_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.get_pack_context, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya builds PySpark pipelines and works with Delta Lake (inferred). Based in Chennai."}]]
    - kind: emit_result
      result: {outcome: done, summary: "Pack ready"}
  expect:
    status: completed
    outcomes: {submissions.save_write_up: executed}
- id: submission_protected_attribute_rewrite
  description: A write-up with a protected attribute is invalid; the clean rewrite is saved
  agent: submission
  seed: submission_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.prepare_pack, {application_id: "{{application_id}}"}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya is married, 34 years old and a data engineer."}]]
    - kind: tool_calls
      calls: [[submissions.save_write_up, {application_id: "{{application_id}}", text: "Priya is a data engineer with PySpark experience."}]]
    - kind: emit_result
      result: {outcome: done, summary: "Pack ready"}
  expect:
    status: completed
    outcomes: {submissions.save_write_up: executed}
- id: submission_check_with_rates
  description: The read-only check tool evaluates proposed rates without writing anything
  agent: submission
  seed: submission_shortlisted
  subject: seed
  script:
    - kind: tool_calls
      calls: [[submissions.check_pack, {application_id: "{{application_id}}", pay_rate: 1400, bill_rate: 1500, currency: INR}]]
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "Checked"}
  expect:
    status: completed
    outcomes: {submissions.check_pack: executed}
    tools_not_executed: [submissions.prepare_pack]
