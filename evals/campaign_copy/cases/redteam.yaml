  expect:
    valid: true
    blocks:
    - missing_optout_sms
- id: redteam_wa_newline
  description: WhatsApp parameter with a newline
  channel: whatsapp
  tags:
  - redteam
  - whatsapp
  template:
    body: Hello {{1}}, we have {{2}} openings. {{3}}
    variables:
    - '1'
    - '2'
    - '3'
  postings:
  - posting_id: 33333333-3333-3333-3333-333333333333
    title: QA Engineer
    location: null
    work_mode: remote
    show_rate: false
    description: Automation testing with Playwright.
  result:
    segments:
    - key: seg_a
      variants:
      - template_values:
          '1': there
          '2': 'QA

            roles'
          '3': Apply
  expect:
    valid: true
    blocks:
    - template_variable_limit
