# Epic 64 Analytics Evaluation Set -- offers (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: of_by_status
  persona: admin
  question: Offers by status
  expected:
    definition:
      source: offers.offer
      group_by:
      - field: status
      measures:
      - &id001
        key: n
        agg: count
    viz:
      type: bar
      x: status
      value: n
  tags: []
- id: of_acceptance_share_fy
  persona: admin
  question: Offer acceptance share this FY
  expected:
    definition:
      source: offers.offer
      filters:
        field: released_at
        op: between
        value: &id002
        - '2026-04-01T00:00:00+05:30'
        - '2027-03-31T23:59:59+05:30'
      group_by:
      - field: status
      measures:
      - key: share
        agg: pct_of_total
    viz:
      type: pie
      x: status
      value: share
  tags:
  - pct_of_total
  - fy
- id: of_by_client
  persona: admin
  question: Offers released by client
  expected:
    definition:
      source: offers.offer
      filters:
        field: status
        op: in
        value:
        - released
        - viewed
        - accepted
        - declined
      group_by:
      - field: client.name
      measures:
      - *id001
    viz:
      type: bar
      x: client.name
      value: n
  tags:
  - by_client
- id: of_avg_margin
  persona: admin
  question: Average offer margin % by client
  expected:
    definition:
      source: offers.offer
      group_by:
      - field: client.name
      measures:
      - key: margin
        agg: avg
        field: version.margin_pct
    viz:
      type: bar
      x: client.name
      value: margin
  tags:
  - compensation
- id: of_per_month
  persona: admin
  question: Offers released per month this FY
  expected:
    definition:
      source: offers.offer
      filters:
        field: released_at
        op: between
        value: *id002
      group_by:
      - field: released_at
        bucket: month
      measures:
      - *id001
    viz:
      type: line
      x: released_at
      value: n
  tags:
  - fy
  - time_series
- id: of_expiring
  persona: admin
  question: Offers expiring in the next 7 days
  expected:
    definition:
      source: offers.offer
      filters:
        and:
        - field: expires_at
          op: within_days
          value:
            days: 7
            direction: future
        - field: status
          op: in
          value:
          - released
          - viewed
      fields:
      - human_id
      - client.name
      - demand.title
      - expires_at
    viz:
      type: table
  tags:
  - list
- id: of_pay_masked
  persona: recruiter
  question: Average offered pay rate
  expected:
    definition:
      source: offers.offer
      measures:
      - key: pay
        agg: avg
        field: version.pay_rate
    viz:
      type: kpi
      value: pay
  tags:
  - masked
  - compensation
