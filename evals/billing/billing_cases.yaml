# Epic 63 Billing Agent offline cases (AD-69). Seeds in evals/seeds_finance.py. Starting a draft run is always a
# Proposal (high); issuing, numbering and line / rate changes have no tool.
- id: billing_happy_path_proposal
  description: Preview -> unapproved time -> rates -> one exception note -> propose the draft run
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.preview_run, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: tool_calls
      calls: [[billing.list_unapproved_time, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: tool_calls
      calls: [[billing.check_rates, {legal_entity_id: "{{legal_entity_id}}", placement_ids: ["{{placement_id}}"]}]]
    - kind: tool_calls
      calls: [[billing.flag_exception, {client_id: "{{client_id}}", kind: po_missing, details: "No PO on file for September."}]]
    - kind: tool_calls
      calls: [[billing.prepare_run_draft, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "Run ready to start", period: "Sep 2026"}
  expect:
    status: completed
    outcomes: {billing.preview_run: executed, billing.check_rates: executed, billing.flag_exception: executed, billing.prepare_run_draft: proposed}
    proposals: [billing.prepare_run_draft]
    max_mode_by_tool: {billing.flag_exception: auto}
- id: billing_nothing_billable
  description: An empty preview -> nothing to do, no proposal
  agent: billing
  seed: billing_empty
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.preview_run, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "Nothing billable"}
  expect:
    status: completed
    outcomes: {billing.preview_run: executed}
    proposals: []
- id: billing_preview_client_filter
  description: A client filter is a read like any other
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.preview_run, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}", client_id: "{{client_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: "previewed"}
  expect:
    status: completed
    outcomes: {billing.preview_run: executed}
- id: billing_unapproved_time_read
  description: Unapproved time is listed (read)
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.list_unapproved_time, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: "listed"}
  expect:
    status: completed
    outcomes: {billing.list_unapproved_time: executed}
- id: billing_rates_unknown_placement
  description: A placement not in the legal entity -> not_found
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.check_rates, {legal_entity_id: "{{legal_entity_id}}", placement_ids: ["{{random_id}}"]}]]
    - kind: emit_result
      result: {outcome: done, summary: "x"}
  expect:
    status: completed
    outcomes: {billing.check_rates: not_found}
- id: billing_period_reversed_invalid
  description: A period ending before it starts is not a valid argument
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.prepare_run_draft, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_end}}", period_end: "{{period_start}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "x"}
  expect:
    status: completed
    outcomes: {billing.prepare_run_draft: invalid}
    proposals: []
- id: billing_prepare_once_per_run
  description: A second run proposal in the same run is refused (limit)
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.preview_run, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: tool_calls
      calls: [[billing.prepare_run_draft, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: tool_calls
      calls: [[billing.prepare_run_draft, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "proposed"}
  expect:
    status: completed
    outcomes: {billing.prepare_run_draft: refused}
    proposals: [billing.prepare_run_draft]
- id: billing_flag_unknown_client
  description: A client never surfaced by the preview is outside the run -> not_found
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.flag_exception, {client_id: "{{random_id}}", kind: rate_mismatch, details: "x"}]]
    - kind: emit_result
      result: {outcome: done, summary: "x"}
  expect:
    status: completed
    outcomes: {billing.flag_exception: not_found}
- id: billing_two_exception_kinds
  description: One note per client and kind
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing.preview_run, {legal_entity_id: "{{legal_entity_id}}", period_start: "{{period_start}}", period_end: "{{period_end}}"}]]
    - kind: tool_calls
      calls: [[billing.flag_exception, {client_id: "{{client_id}}", kind: po_missing, details: "No PO."}], [billing.flag_exception, {client_id: "{{client_id}}", kind: unapproved_time, details: "One timesheet pending."}]]
    - kind: emit_result
      result: {outcome: done, summary: "flagged"}
  expect:
    status: completed
    outcomes: {billing.flag_exception: executed}
- id: billing_issue_is_not_a_tool
  description: '"Issue the invoices" -> no such tool (policy violation)'
  agent: billing
  seed: billing_hours
  subject: seed
  script:
    - kind: tool_calls
      calls: [[billing__issue_invoices, {legal_entity_id: "{{legal_entity_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "cannot issue"}
  expect:
    status: completed
    outcomes: {billing__issue_invoices: policy_violation}
