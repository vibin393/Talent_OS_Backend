# SonarCloud analysis config (public repo, automatic analysis).
# Project key / organization are set by the SonarCloud GitHub binding, not here.
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
# Auto-generated Alembic migrations are not hand-maintained — exclude from issues/duplication.
sonar.exclusions=alembic/versions/**,**/migrations/**
sonar.sourceEncoding=UTF-8
