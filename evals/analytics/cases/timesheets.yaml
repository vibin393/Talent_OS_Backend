# Epic 64 Analytics Evaluation Set -- timesheets (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: ts_hours_by_client_month
  persona: admin
  question: Approved hours by client by month this FY
  expected:
    definition:
      source: time.timesheet
      filters:
        field: entry_date
        op: between
        value: &id001
        - '2026-04-01'
        - '2027-03-31'
      group_by:
      - field: client.name
      - field: entry_date
        bucket: month
      measures:
      - key: hours
        agg: sum
        field: hours
    viz:
      type: bar
      x: entry_date
      value: hours
      series: client.name
  tags:
  - by_client
  - fy
- id: ts_by_category
  persona: admin
  question: Hours by category
  expected:
    definition:
      source: time.timesheet
      group_by:
      - field: category
      measures:
      - key: hours
        agg: sum
        field: hours
    viz:
      type: pie
      x: category
      value: hours
  tags: []
- id: ts_ot_share
  persona: admin
  question: Overtime share of hours this month
  expected:
    definition:
      source: time.timesheet
      filters:
        field: entry_date
        op: between
        value: &id002
        - '2026-10-01'
        - '2026-10-31'
      group_by:
      - field: category
      measures:
      - key: share
        agg: pct_of_total
        field: hours
    viz:
      type: pie
      x: category
      value: share
  tags:
  - pct_of_total
  - this_month
- id: ts_total_hours_fy
  persona: admin
  question: Total approved hours this FY
  expected:
    definition:
      source: time.timesheet
      filters:
        field: entry_date
        op: between
        value: *id001
      measures:
      - key: hours
        agg: sum
        field: hours
    viz:
      type: kpi
      value: hours
  tags:
  - fy
  - kpi
- id: ts_hours_per_week
  persona: admin
  question: Approved hours per week this quarter
  expected:
    definition:
      source: time.timesheet
      filters:
        field: entry_date
        op: between
        value:
        - '2026-10-01'
        - '2026-12-31'
      group_by:
      - field: entry_date
        bucket: week
      measures:
      - key: hours
        agg: sum
        field: hours
    viz:
      type: line
      x: entry_date
      value: hours
    assumptions:
    - I took 'this quarter' as Oct-Dec 2026
  tags:
  - quarter
  - time_series
- id: ts_top_workers
  persona: admin
  question: Workers with the most hours this month
  expected:
    definition:
      source: time.timesheet
      filters:
        field: entry_date
        op: between
        value: *id002
      group_by:
      - field: timesheet.placement_id
      measures:
      - key: hours
        agg: sum
        field: hours
      sort:
      - key: hours
        desc: true
    viz:
      type: bar
      x: timesheet.placement_id
      value: hours
  tags:
  - top_n
  - this_month
