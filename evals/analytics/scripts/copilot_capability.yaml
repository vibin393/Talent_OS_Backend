# Epic 64 story 64.4: in the general Copilot the analytics capability tools are offered only when agent_analytics is on
# (and the user holds report:read); with it off they are not offered and a call is a policy violation.
# Exercised by tests/agents/analytics/test_capability.py against the Copilot allow-list (runtime state.allow_list).
id: copilot_capability
description: Capability tools offered only with agent_analytics on
persona: admin
capability: true
script:
  - kind: tool_calls
    calls: [[semantic.run, {question: Open demands by priority, definition: {source: demands.demand, filters: {field: status, op: eq, value: open}, group_by: [{field: priority}]}, viz: {type: bar, x: priority}}]]
  - kind: text
    text: Here are your open demands by priority.
expect:
  status: completed
  sequence: [[semantic.run, executed]]
  answers: 1
