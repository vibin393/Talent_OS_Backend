# Epic 55 (A10, FR-284): sla.status -> flags.raise -> two tasks with links. No demand field changes.
agent_demand:
  - kind: tool_calls
    calls: [[sla.status, {demand_id: "{{demand_id}}"}]]
  - kind: tool_calls
    calls: [[flags.raise, {entity_type: demand, entity_id: "{{demand_id}}", flag: risk, severity: high, message: "First submission is late."}]]
  - kind: tool_calls
    calls:
      - [tasks.create, {title: "Review matches for the demand", entity_type: demand, entity_id: "{{demand_id}}", due_in_hours: 8}]
      - [tasks.create, {title: "Widen skills using the skills graph", entity_type: demand, entity_id: "{{demand_id}}", due_in_hours: 24}]
  - kind: emit_result
    result: {outcome: done, summary: "Raised an SLA flag.", flags_raised: 1}
