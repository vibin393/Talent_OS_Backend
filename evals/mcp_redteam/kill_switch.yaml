id: mcp_kill_switch
description: The AI kill switch turned on mid-session refuses the next call and ends the session.
steps:
  - do: call
    tool: navigation__screen_for
    args: {action: other}
    expect: {is_error: false}
  - do: kill_switch
  - do: rpc
    method: ping
    expect: {http_in: [403, 404]}
  - do: session_status
    expect: {status: ended, end_reason: ai_kill_switch}
