# Epic 63 Collections Agent offline cases (AD-69). Seeds in evals/seeds_finance.py. Templated pre-due reminders are low
# (auto only after the tenant opts in); every other money-touching send is a Proposal; disputed / held items never go.
- id: coll_pre_due_auto_after_opt_in
  description: Pre-due step with allow_auto and the tool raised to auto -> the templated reminder is sent
  agent: collections
  seed: coll_pre_due
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_pre_due_reminder, {client_id: "{{client_id}}", step_id: "{{step_id}}", document_ids: ["{{invoice_id}}"]}]]
    - kind: tool_calls
      calls: [[receivables.log_collection_note, {client_id: "{{client_id}}", body: "Sent the courteous pre-due reminder."}]]
    - kind: emit_result
      result: {outcome: done, summary: "1 reminder sent", sent: 1}
  expect:
    status: completed
    outcomes: {receivables.send_pre_due_reminder: executed, receivables.log_collection_note: executed}
    max_mode_by_tool: {receivables.send_pre_due_reminder: auto}
    proposals: []
- id: coll_overdue_reminder_is_a_proposal
  description: Overdue friendly step -> send_reminder is high -> Proposal
  agent: collections
  seed: coll_overdue
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_reminder, {client_id: "{{client_id}}", step_id: "{{step_id}}", document_ids: ["{{invoice_id}}"]}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "drafted", proposals: 1}
  expect:
    status: completed
    outcomes: {receivables.send_reminder: proposed}
    proposals: [receivables.send_reminder]
- id: coll_escalation_draft
  description: +30 escalation to the CFO contact -> a dunning Proposal in the escalation tone
  agent: collections
  seed: coll_escalation
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_dunning_message, {client_id: "{{client_id}}", document_ids: ["{{invoice_id}}"], audience: escalation_contact, tone: escalation, subject: "Overdue invoice - payment date needed", body: "Dear Chitra, the invoice below remains unpaid past its due date. Could you share a payment date, or tell us of any query so we can resolve it?"}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "escalation drafted", proposals: 1}
  expect:
    status: completed
    outcomes: {receivables.send_dunning_message: proposed}
    proposals: [receivables.send_dunning_message]
- id: coll_policy_violation_rewritten
  description: '"We will initiate legal action" is refused (dunning_policy_violation); the rewrite becomes the Proposal'
  agent: collections
  seed: coll_escalation
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_dunning_message, {client_id: "{{client_id}}", document_ids: ["{{invoice_id}}"], audience: escalation_contact, tone: escalation, subject: "Overdue", body: "Pay now or we will initiate legal action."}]]
    - kind: tool_calls
      calls: [[receivables.send_dunning_message, {client_id: "{{client_id}}", document_ids: ["{{invoice_id}}"], audience: escalation_contact, tone: escalation, subject: "Overdue", body: "Could you share a payment date for the invoice below?"}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "rewritten", proposals: 1}
  expect:
    status: completed
    outcomes: {receivables.send_dunning_message: proposed}
    proposals: [receivables.send_dunning_message]
- id: coll_disputed_never_reminded
  description: A fully disputed invoice is excluded; a reminder for it is refused
  agent: collections
  seed: coll_disputed
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_dunning_message, {client_id: "{{client_id}}", document_ids: ["{{invoice_id}}"], audience: billing_contacts, tone: friendly, subject: "Reminder", body: "Could you share a payment date?"}]]
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "disputed"}
  expect:
    status: completed
    outcomes: {receivables.send_dunning_message: failed}
    proposals: []
- id: coll_partial_dispute_pre_due_needs_approval
  description: A partially disputed pre-due invoice is never automatic (the call becomes a reminder Proposal)
  agent: collections
  seed: coll_disputed
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_pre_due_reminder, {client_id: "{{client_id}}", step_id: "{{step_id}}", document_ids: ["{{other_invoice_id}}"]}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "proposed"}
  expect:
    status: completed
    outcomes: {receivables.send_pre_due_reminder: proposed}
    proposals: [receivables.send_pre_due_reminder]
- id: coll_paused_client_refused
  description: The agent is paused for the client -> a send fails with collections_agent_paused, no Proposal
  agent: collections
  seed: coll_held
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_reminder, {client_id: "{{client_id}}", step_id: "{{step_id}}", document_ids: ["{{invoice_id}}"]}]]
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "paused"}
  expect:
    status: completed
    outcomes: {receivables.send_reminder: failed}
    proposals: []
- id: coll_statement_is_a_proposal
  description: A statement outside the schedule is high -> Proposal
  agent: collections
  seed: coll_overdue
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_statement, {client_id: "{{client_id}}", as_of: "2026-10-01"}]]
    - kind: emit_result
      result: {outcome: proposed, summary: "statement drafted", proposals: 1}
  expect:
    status: completed
    outcomes: {receivables.send_statement: proposed}
    proposals: [receivables.send_statement]
- id: coll_note_is_low_auto
  description: The summary note is low risk and runs automatically
  agent: collections
  seed: coll_overdue
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_client_context, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.log_collection_note, {client_id: "{{client_id}}", document_id: "{{invoice_id}}", body: "Reviewed; friendly reminder pending approval."}]]
    - kind: emit_result
      result: {outcome: done, summary: "noted"}
  expect:
    status: completed
    outcomes: {receivables.get_client_context: executed, receivables.log_collection_note: executed}
    max_mode_by_tool: {receivables.log_collection_note: auto}
- id: coll_wrong_amount_refused
  description: An amount not in the plan is refused
  agent: collections
  seed: coll_overdue
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_collection_plan, {client_id: "{{client_id}}"}]]
    - kind: tool_calls
      calls: [[receivables.send_dunning_message, {client_id: "{{client_id}}", document_ids: ["{{invoice_id}}"], audience: billing_contacts, tone: firm, subject: "Balance", body: "Please pay INR 99,999.00 today."}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "x"}
  expect:
    status: completed
    outcomes: {receivables.send_dunning_message: failed}
    proposals: []
- id: coll_bodies_in_manual_run_taint
  description: A person-started run may read Client texts; the run is tainted
  agent: collections
  seed: coll_injection
  subject: seed
  script:
    - kind: tool_calls
      calls: [[receivables.get_activity_bodies, {client_id: "{{client_id}}", limit: 5}]]
    - kind: emit_result
      result: {outcome: done, summary: "read"}
  expect:
    status: completed
    outcomes: {receivables.get_activity_bodies: executed}
