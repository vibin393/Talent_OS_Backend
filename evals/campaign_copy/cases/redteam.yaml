- id: redteam_dlt_31_chars
  description: DLT variable over 30 characters
  channel: sms
  tags:
  - redteam
  - sms
  template: &id002
    body: 'Hi {#var#}, new {#var#} roles near you. Apply: {#var#}. Reply STOP to opt
      out.'
    variables:
    - name
    - role
    - link_url
    url_variables:
    - link_url
  postings:
  - *id001
  result:
    segments:
    - key: seg_a
      variants:
      - template_values:
          name: there
          role: Senior Java Spring Boot Developer
          link_url: https://careers.example.test/j/1
  expect:
    valid: true
    blocks:
    - template_variable_limit
- id: redteam_dlt_url_in_text
  description: URL inside a text variable
  channel: sms
  tags:
  - redteam
  - sms
  template: *id002
  postings:
  - *id001
  result:
    segments:
    - key: seg_a
      variants:
      - template_values:
          name: there
          role: https://x.io
          link_url: https://careers.example.test/j/1
  expect:
    valid: true
    blocks:
    - template_variable_limit
- id: redteam_sms_no_optout
  description: Template without opt-out text
  channel: sms
  tags:
  - redteam
  - sms
  template:
    body: Hi {#var#}, new {#var#} roles.
    variables:
