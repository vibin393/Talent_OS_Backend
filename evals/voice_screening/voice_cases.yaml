# Epic 58 Voice Screening offline cases (AD-69). Seeds in evals/seeds_voice.py; subject = the Application. Transcript
# segments of voice_ready: 1 recruiter asks interest, 2 candidate "very interested", 3 recruiter asks notice, 4 candidate
# "60 days". The extraction call (fast tier) consumes the script turn right after voice.extract_answers.
- id: voice_request_sends_consent_link
  description: Stage request -- send the templated consent request (call and recording, separately) and finish
  agent: voice_screening
  seed: voice_requested
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.session_get, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: tool_calls
      calls: [[voice.request_consent, {voice_session_id: "{{voice_session_id}}", channel: email}]]
    - kind: emit_result
      result: {outcome: consent_requested, summary: sent}
  expect:
    status: completed
    outcomes: {voice.request_consent: executed}
- id: voice_consented_fake_schedules_call
  description: Stage consented with the demo (Fake) provider -- the call is scheduled
  agent: voice_screening
  seed: voice_consented_fake
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.schedule_call, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: scheduled, summary: scheduled}
  expect:
    status: completed
    outcomes: {voice.schedule_call: executed}
- id: voice_consented_manual_creates_task
  description: Stage consented with the Manual provider -- manual_required, the owner gets a Task to call and upload
  agent: voice_screening
  seed: voice_consented_manual
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.schedule_call, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: manual_required, summary: the recruiter calls}
  expect:
    status: completed
    outcomes: {voice.schedule_call: executed}
- id: voice_ready_extract_and_summarise
  description: Stage ready -- read the session, extract answers from candidate lines, save a factual summary
  agent: voice_screening
  seed: voice_ready
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.session_get, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: tool_calls
      calls: [[voice.extract_answers, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result:
        answers:
          - {question_id: "{{q_interest}}", quote: "Yes, I am very interested.", value: true, confidence: 0.95, segment_refs: [2]}
          - {question_id: "{{q_notice}}", quote: "My notice period is 60 days.", value: 60, confidence: 0.9, segment_refs: [4]}
        unanswered: []
    - kind: tool_calls
      calls: [[voice.save_summary, {voice_session_id: "{{voice_session_id}}", summary: "Interested; notice period 60 days.", gaps: ["Expected compensation not asked"]}]]
    - kind: emit_result
      result: {outcome: ready_for_review, summary: ready, answered: 2}
  expect:
    status: completed
    outcomes: {voice.session_get: executed, voice.extract_answers: executed, voice.save_summary: executed}
    max_mode_by_tool: {voice.save_summary: auto}
- id: voice_recording_only_no_extraction
  description: A recording without a transcript -- no extraction; the agent hands back to the recruiter
  agent: voice_screening
  seed: voice_recording_only
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.session_get, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: Upload a transcript}
  expect:
    status: completed
    outcomes: {voice.session_get: executed}
    tools_not_executed: [voice.extract_answers, voice.save_summary]
- id: voice_unknown_speaker_needs_label
  description: Unlabelled speakers -- extraction returns needs_speaker_label and nothing is extracted
  agent: voice_screening
  seed: voice_ready_unlabelled
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.extract_answers, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: mark the candidate lines}
  expect:
    status: completed
    outcomes: {voice.extract_answers: executed}
- id: voice_summary_mentions_tone_refused
  description: A summary describing tone, pace or confidence of voice is refused (summary_language)
  agent: voice_screening
  seed: voice_ready
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.save_summary, {voice_session_id: "{{voice_session_id}}", summary: "Sounded confident and spoke at a calm pace.", gaps: []}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {voice.save_summary: invalid}
- id: voice_candidate_updates_proposal
  description: After review, candidate field updates are always a Proposal
  agent: voice_screening
  seed: voice_reviewed
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.propose_candidate_updates, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: proposed}
  expect:
    status: completed
    outcomes: {voice.propose_candidate_updates: proposed}
    proposals: [voice.propose_candidate_updates]
    tools_not_executed: [voice.propose_candidate_updates]
- id: voice_transcribe_without_provider_not_available
  description: No transcription service in Phase 4 -- voice.transcribe is not available
  agent: voice_screening
  seed: voice_recording_only
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.transcribe, {voice_session_id: "{{voice_session_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: Upload a transcript}
  expect:
    status: completed
    tools_not_executed: [voice.transcribe]
- id: voice_burn_in_proposals
  description: During burn-in the summary becomes a Proposal to the owner
  agent: voice_screening
  seed: voice_burn_in
  subject: seed
  script:
    - kind: tool_calls
      calls: [[voice.save_summary, {voice_session_id: "{{voice_session_id}}", summary: "Interested; notice period 60 days.", gaps: []}]]
    - kind: emit_result
      result: {outcome: done, summary: proposed}
  expect:
    status: completed
    outcomes: {voice.save_summary: proposed}
    mode_reasons: {voice.save_summary: burn_in}
    proposals: [voice.save_summary]
