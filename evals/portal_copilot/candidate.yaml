# Epic 77 portal Copilot Evaluation Set (candidate portal). Fake LLM scripts; run by tests/portal_copilot/test_evals_portal.py (-m evals).
- id: candidate_read_00
  who: cand_1
  question: What's the status of my application?
  script:
  - kind: tool_calls
    calls:
    - - portal_candidate.list_applications
      - {}
  - kind: text
    text: Here is what I found.
  expect:
    outcomes:
      portal_candidate.list_applications: executed
    status: completed
