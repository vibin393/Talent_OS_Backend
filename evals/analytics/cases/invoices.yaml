# Epic 64 Analytics Evaluation Set -- invoices (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: inv_revenue_by_client_fy
  persona: admin
  question: Invoiced amount by client this FY
  expected:
    definition:
      source: billing.invoice
      filters:
        field: fiscal_year
        op: eq
        value: 26-27
      group_by:
      - field: client.name
      measures:
      - key: total
        agg: sum
        field: inr_document_total
      sort:
      - key: total
        desc: true
    viz:
      type: bar
      x: client.name
      value: total
  tags:
  - by_client
  - fy
- id: inv_per_month
  persona: admin
  question: Invoiced amount per month this FY
  expected:
    definition:
      source: billing.invoice
      filters:
        field: doc_date
        op: between
        value:
        - '2026-04-01'
        - '2027-03-31'
      group_by:
      - field: doc_date
        bucket: month
      measures:
      - key: total
        agg: sum
        field: inr_taxable_total
    viz:
      type: line
      x: doc_date
      value: total
  tags:
  - fy
  - time_series
- id: inv_count_this_month
  persona: admin
  question: Invoices issued this month
  expected:
    definition:
      source: billing.invoice
      filters:
        field: doc_date
        op: between
        value:
        - '2026-10-01'
        - '2026-10-31'
      measures:
      - key: n
        agg: count
    viz:
      type: kpi
      value: n
  tags:
  - this_month
- id: inv_tax_share
  persona: admin
  question: Tax as a share of invoiced amount by client
  expected:
    definition:
      source: billing.invoice
      group_by:
      - field: client.name
      measures:
      - key: tax
        agg: sum
        field: tax_total
      - key: taxable
        agg: sum
        field: taxable_total
      - key: tax_ratio
        agg: ratio
        of:
        - tax
        - taxable
    viz:
      type: bar
      x: client.name
      value: tax_ratio
  tags:
  - ratio
- id: inv_by_fy
  persona: admin
  question: Invoiced amount per financial year
  expected:
    definition:
      source: billing.invoice
      group_by:
      - field: fiscal_year
      measures:
      - key: total
        agg: sum
        field: inr_document_total
    viz:
      type: bar
      x: fiscal_year
      value: total
  tags:
  - fy
- id: inv_due_30d
  persona: admin
  question: Invoices due in the next 30 days
  expected:
    definition:
      source: billing.invoice
      filters:
        field: due_date
        op: within_days
        value:
          days: 30
          direction: future
      fields:
      - number
      - client.name
      - due_date
      - document_total
    viz:
      type: table
  tags:
  - list
