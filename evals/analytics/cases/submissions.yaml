# Epic 64 Analytics Evaluation Set -- submissions (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: sb_by_client_fy
  persona: admin
  question: Submissions sent by client this FY
  expected:
    definition:
      source: pipeline.submission
      filters:
        and:
        - field: status
          op: eq
          value: sent
        - field: sent_at
          op: between
          value: &id002
          - '2026-04-01T00:00:00+05:30'
          - '2027-03-31T23:59:59+05:30'
      group_by:
      - field: client.name
      measures:
      - &id001
        key: n
        agg: count
    viz:
      type: bar
      x: client.name
      value: n
  tags:
  - by_client
  - fy
- id: sb_feedback_status
  persona: admin
  question: Submissions by feedback status
  expected:
    definition:
      source: pipeline.submission
      group_by:
      - field: feedback_status
      measures:
      - *id001
    viz:
      type: pie
      x: feedback_status
      value: n
  tags: []
- id: sb_avg_margin_pct
  persona: admin
  question: Average margin % on submissions by client
  expected:
    definition:
      source: pipeline.submission
      group_by:
      - field: client.name
      measures:
      - key: margin
        agg: avg
        field: margin_pct
    viz:
      type: bar
      x: client.name
      value: margin
  tags:
  - compensation
- id: sb_below_margin
  persona: admin
  question: How many submissions were below minimum margin?
  expected:
    definition:
      source: pipeline.submission
      filters:
        field: below_min_margin
        op: eq
        value: true
      measures:
      - *id001
    viz:
      type: kpi
      value: n
  tags:
  - kpi
- id: sb_per_month
  persona: admin
  question: Submissions sent per month this FY
  expected:
    definition:
      source: pipeline.submission
      filters:
        field: sent_at
        op: between
        value: *id002
      group_by:
      - field: sent_at
        bucket: month
      measures:
      - *id001
    viz:
      type: line
      x: sent_at
      value: n
  tags:
  - fy
  - time_series
- id: sb_interest_rate
  persona: admin
  question: Share of sent submissions with client interest by client
  expected:
    definition:
      source: pipeline.submission
      filters:
        field: status
        op: eq
        value: sent
      group_by:
      - field: client.name
      - field: feedback_status
      measures:
      - key: share
        agg: pct_of_total
    viz:
      type: pivot
      x: client.name
      value: share
      series: feedback_status
  tags:
  - pct_of_total
  - pivot
- id: sb_this_month
  persona: admin
  question: Submissions created this month
  expected:
    definition:
      source: pipeline.submission
      filters:
        field: created_at
        op: between
        value:
        - '2026-10-01T00:00:00+05:30'
        - '2026-10-31T23:59:59+05:30'
      measures:
      - *id001
    viz:
      type: kpi
      value: n
  tags:
  - this_month
- id: sb_margin_masked
  persona: recruiter
  question: Total margin on submissions
  expected:
    definition:
      source: pipeline.submission
      measures:
      - key: margin
        agg: sum
        field: margin_amount
    viz:
      type: kpi
      value: margin
  tags:
  - masked
  - compensation
