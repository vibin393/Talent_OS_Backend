# Epic 55 (A10, FR-282): an opened demand without a JD -> preview_jd then demands.update (high -> a Proposal).
demands_jd_generate:
  - kind: emit_result
    result: {content: "## Senior Data Engineer\n\nYou will build data pipelines on Azure. Must have PySpark."}
agent_demand:
  - kind: tool_calls
    calls: [[demands.get_for_review, {demand_id: "{{demand_id}}"}]]
  - kind: tool_calls
    calls: [[demands.preview_jd, {demand_id: "{{demand_id}}"}]]
  - kind: tool_calls
    calls: [[demands.update, {demand_id: "{{demand_id}}", jd_content: "## Senior Data Engineer\n\nYou will build data pipelines on Azure. Must have PySpark."}]]
  - kind: emit_result
    result: {outcome: done, summary: "Proposed a JD."}
