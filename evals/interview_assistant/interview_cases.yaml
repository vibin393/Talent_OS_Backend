# Epic 60 Interview Assistant offline cases (AD-69). Seeds in evals/seeds_interview_assist.py: an Interview with two
# internal interviewers (Ann = {{p_ann}}, Bob = {{p_bob}}), kit python / communication (questions q_python / q_explain,
# scale 5) and a consented, speaker-mapped transcript (segments: 1 Ann asks, 2 Priya on the Python pipeline, 3 Bob asks,
# 4 Priya on design notes).
- id: ia_happy_path_two_interviewers
  description: Read the interview, kit and transcript -> summary, skill suggestions and one private draft per interviewer
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - [interviews.get, {interview_id: "{{interview_id}}"}]
        - [interview_kits.get, {interview_id: "{{interview_id}}"}]
    - kind: tool_calls
      calls: [[interview_capture.transcript, {capture_id: "{{capture_id}}"}]]
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency:
              - {competency_key: python, summary: "Built a Python data pipeline with Pandas and Airflow.", evidence: [{segment_seq: 2, quote: "data pipeline in Python with Pandas and Airflow"}]}
              - {competency_key: communication, summary: "Writes design notes with diagrams for the business team.", evidence: [{segment_seq: 4, quote: "short design notes with diagrams"}]}
            qa_items:
              - {asked_text: "Tell me about a Python project you built.", kit_question_key: q_python, match_confidence: 0.95, response_quote: "I built a data pipeline in Python", segment_seqs: [2]}
              - {asked_text: "How do you explain technical work?", kit_question_key: q_explain, match_confidence: 0.9, response_quote: "I write short design notes", segment_seqs: [4]}
    - kind: tool_calls
      calls:
        - - skills.suggest_evidence
          - capture_id: "{{capture_id}}"
            items:
              - {skill_name: Python, proficiency: 4, quote: "data pipeline in Python", segment_seq: 2}
              - {skill_name: Pandas, proficiency: 3, quote: "Pandas and Airflow", segment_seq: 2}
    - kind: tool_calls
      calls:
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_ann}}"
            ratings:
              - {competency_key: python, suggested_rating: 4, rationale: "Production pipeline with concrete volume.", evidence: [{segment_seq: 2, quote: "processed two million rows a day"}]}
              - {competency_key: communication, suggested_rating: 3, rationale: "Shares written design notes each sprint.", evidence: [{segment_seq: 4, quote: "walk the business team through them"}]}
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_bob}}"
            ratings:
              - {competency_key: python, suggested_rating: 4, rationale: "Production pipeline with concrete volume.", evidence: [{segment_seq: 2, quote: "processed two million rows a day"}]}
              - {competency_key: communication, suggested_rating: 3, rationale: "Shares written design notes each sprint.", evidence: [{segment_seq: 4, quote: "walk the business team through them"}]}
    - kind: emit_result
      result: {outcome: done, summary: "Summary, 2 drafts and 2 skill suggestions.", drafts: 2, skill_suggestions: 2}
  expect:
    status: completed
    outcomes: {interview_capture.save_summary: executed, scorecards.create_draft: executed, skills.suggest_evidence: executed, interview_capture.transcript: executed}
    max_mode_by_tool: {scorecards.create_draft: auto}
- id: ia_kit_question_mapping
  description: Questions asked are mapped to kit question keys with quoted, timestamped answers
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: python, summary: "Python pipeline.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
            qa_items: [{asked_text: "Tell me about a Python project you built.", kit_question_key: q_python, match_confidence: 0.97, response_quote: "data pipeline in Python with Pandas", segment_seqs: [2]}]
    - kind: emit_result
      result: {outcome: done, summary: mapped}
  expect:
    status: completed
    outcomes: {interview_capture.save_summary: executed}
- id: ia_unmapped_questions
  description: A question that matches no kit question is kept with a null key
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: communication, summary: "Design notes.", evidence: []}]
            qa_items: [{asked_text: "How do you explain technical work?", kit_question_key: null, response_quote: "walk the business team through them every sprint", segment_seqs: [4]}]
    - kind: emit_result
      result: {outcome: done, summary: unmapped}
  expect:
    status: completed
    outcomes: {interview_capture.save_summary: executed}
- id: ia_invalid_quote_rejected
  description: A quote that is not in the referenced segment is invalid_evidence (outcome invalid)
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: python, summary: "Python.", evidence: [{segment_seq: 2, quote: "I invented Python"}]}]
    - kind: emit_result
      result: {outcome: needs_human, summary: rejected}
  expect:
    status: completed
    outcomes: {interview_capture.save_summary: invalid}
    fallback_task: true
- id: ia_rating_out_of_scale
  description: A suggested rating above the kit's rating scale is invalid
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_ann}}"
            ratings: [{competency_key: python, suggested_rating: 9, rationale: "Strong.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {scorecards.create_draft: invalid}
- id: ia_tone_language_refused
  description: A rationale about confidence of voice and honesty is refused (summary_language)
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_ann}}"
            ratings: [{competency_key: python, suggested_rating: 4, rationale: "She sounded confident and honest.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {scorecards.create_draft: invalid}
- id: ia_no_kit_overall_competency
  description: Without a kit the single competency is overall
  agent: interview_assist
  seed: interview_capture_no_kit
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interview_kits.get, {interview_id: "{{interview_id}}"}]]
    - kind: tool_calls
      calls:
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_ann}}"
            ratings: [{competency_key: overall, suggested_rating: 4, rationale: "Concrete pipeline example.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
    - kind: emit_result
      result: {outcome: done, summary: overall}
  expect:
    status: completed
    outcomes: {interview_kits.get: executed, scorecards.create_draft: executed}
- id: ia_transcribe_without_provider
  description: There is no speech-to-text -- transcribe fails with not_available
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interview_capture.transcribe, {capture_id: "{{capture_id}}"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: "Ask the uploader for the meeting transcript."}
  expect:
    status: completed
    outcomes: {interview_capture.transcribe: failed}
- id: ia_burn_in_proposals
  description: During burn-in every write becomes a Proposal to the owner
  agent: interview_assist
  seed: interview_capture_burn_in
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: python, summary: "Python pipeline.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
        - - scorecards.create_draft
          - capture_id: "{{capture_id}}"
            participant_id: "{{p_ann}}"
            ratings: [{competency_key: python, suggested_rating: 4, rationale: "Concrete pipeline.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
    - kind: emit_result
      result: {outcome: done, summary: proposed}
  expect:
    status: completed
    proposals: [interview_capture.save_summary, scorecards.create_draft]
    tools_not_executed: [interview_capture.save_summary, scorecards.create_draft]
- id: ia_rerun_supersedes_outputs
  description: A second summary in the same run replaces the first
  agent: interview_assist
  seed: interview_capture_ready
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: python, summary: "First pass.", evidence: []}]
    - kind: tool_calls
      calls:
        - - interview_capture.save_summary
          - capture_id: "{{capture_id}}"
            summary_by_competency: [{competency_key: python, summary: "Second pass with evidence.", evidence: [{segment_seq: 2, quote: "two million rows a day"}]}]
    - kind: emit_result
      result: {outcome: done, summary: replaced}
  expect:
    status: completed
    outcomes: {interview_capture.save_summary: executed}
