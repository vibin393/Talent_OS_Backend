# Epic 56 Sourcing Agent offline cases (AD-69). Seed ``sourcing_demand`` (evals/seeds_sourcing.py): a = 90, c = 80
# (recent), b = 80, d = search-only without AI consent, e in pipeline, f archived, g do-not-contact.
- id: sourcing_open_happy_path
  description: Rank, rediscovery and pools -> save the shortlist -> check caps -> draft the top entries; outreach only as Proposals
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls:
        - [shortlists.get_for_demand, {demand_id: "{{demand_id}}"}]
        - [matching.list_ranked_matches, {demand_id: "{{demand_id}}", limit: 50}]
        - [rediscovery.summary, {demand_id: "{{demand_id}}"}]
        - [pools.members, {demand_id: "{{demand_id}}"}]
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", summary: "Three matches", candidates: []}]]
    - kind: tool_calls
      calls: [[messaging.cap_status, {demand_id: "{{demand_id}}", candidate_ids: ["{{cand_a}}", "{{cand_c}}"]}]]
    - kind: tool_calls
      calls:
        - - outreach.create_draft
          - demand_id: "{{demand_id}}"
            drafts:
              - {candidate_id: "{{cand_a}}", subject: "A data role", body: "Hi Asha, we are hiring a Senior Data Engineer in Chennai. Open to a short call?"}
              - {candidate_id: "{{cand_c}}", subject: "A data role", body: "Hi Chitra, we are hiring a Senior Data Engineer in Chennai. Open to a short call?"}
    - kind: emit_result
      result: {outcome: done, summary: "Shortlist saved, 2 drafts", drafted: 2}
  expect:
    status: completed
    outcomes: {shortlists.save_suggested: executed, outreach.create_draft: executed, messaging.cap_status: executed}
    max_mode_by_tool: {shortlists.save_suggested: auto}
    proposals: [outreach.send, outreach.send]
    tools_not_executed: [outreach.send]
- id: sourcing_model_tries_to_score
  description: A score in the save call is refused by the strict schema; the server ranks
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: [{candidate_id: "{{cand_b}}", score: 99}]}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {shortlists.save_suggested: invalid}
- id: sourcing_search_adds_keyword_candidates
  description: A structured search hit is added to the shortlist with a search source tag
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[search.search_candidates, {text: "Kumar", limit: 10}]]
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: [{candidate_id: "{{cand_d}}", sources: [{kind: search}]}]}]]
    - kind: emit_result
      result: {outcome: done, summary: searched}
  expect:
    status: completed
    outcomes: {search.search_candidates: executed, shortlists.save_suggested: executed}
- id: sourcing_no_ai_consent_keyword_only
  description: A candidate without AI consent appears only from search and gets no draft
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: [{candidate_id: "{{cand_d}}", sources: [{kind: search}]}]}]]
    - kind: tool_calls
      calls: [[outreach.create_draft, {demand_id: "{{demand_id}}", drafts: [{candidate_id: "{{cand_d}}", body: "Hi Dev, interested in a data role?"}]}]]
    - kind: emit_result
      result: {outcome: done, summary: no draft}
  expect:
    status: completed
    outcomes: {outreach.create_draft: invalid}
- id: sourcing_suppressed_no_draft
  description: A do-not-contact candidate is excluded from the shortlist, so no draft can be made
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: []}]]
    - kind: tool_calls
      calls: [[outreach.create_draft, {demand_id: "{{demand_id}}", drafts: [{candidate_id: "{{cand_g}}", body: "Hi Gita, interested in a data role?"}]}]]
    - kind: emit_result
      result: {outcome: done, summary: excluded}
  expect:
    status: completed
    outcomes: {outreach.create_draft: not_found}
- id: sourcing_comp_out_of_range
  description: A draft quoting pay above the published range is invalid (comp_outside_range)
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: []}]]
    - kind: tool_calls
      calls: [[outreach.create_draft, {demand_id: "{{demand_id}}", drafts: [{candidate_id: "{{cand_a}}", body: "The role pays INR 40 LPA."}]}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {outreach.create_draft: invalid}
- id: sourcing_sms_free_text_refused
  description: Free-text SMS outreach is refused (template-only channel)
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: []}]]
    - kind: tool_calls
      calls: [[outreach.create_draft, {demand_id: "{{demand_id}}", drafts: [{candidate_id: "{{cand_a}}", channel: sms, body: "Hi Asha, new role. Call me."}]}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {outreach.create_draft: invalid}
- id: sourcing_rerank_requirements_change
  description: A second save in the same run supersedes the first version (re-rank)
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: []}]]
    - kind: tool_calls
      calls: [[shortlists.save_suggested, {demand_id: "{{demand_id}}", candidates: [{candidate_id: "{{cand_d}}", sources: [{kind: search}]}]}]]
    - kind: emit_result
      result: {outcome: done, summary: reranked}
  expect:
    status: completed
    outcomes: {shortlists.save_suggested: executed}
- id: sourcing_pipeline_add_proposal
  description: Pipeline-add proposals are off by default, so the attempt fails and nothing is added
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[pipeline.add_candidate, {demand_id: "{{demand_id}}", candidate_id: "{{cand_a}}", reason: "Strong match"}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    outcomes: {pipeline.add_candidate: failed}
    tools_not_executed: [pipeline.add_candidate]
- id: sourcing_engagement_facts
  description: Drafting facts for a shortlisted candidate are a read
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[matching.list_ranked_matches, {demand_id: "{{demand_id}}"}]]
    - kind: tool_calls
      calls: [[candidates.engagement, {candidate_id: "{{cand_a}}", demand_id: "{{demand_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: read}
  expect:
    status: completed
    outcomes: {candidates.engagement: executed}
- id: sourcing_sequence_enrol_not_enabled
  description: Enrolment proposals need the Sequence chosen in the settings; an unknown Sequence is refused
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: tool_calls
      calls: [[sequences.enrol, {sequence_id: "{{random_id}}", demand_id: "{{demand_id}}", candidate_ids: ["{{cand_a}}"]}]]
    - kind: emit_result
      result: {outcome: done, summary: tried}
  expect:
    status: completed
    tools_not_executed: [sequences.enrol]
- id: sourcing_nothing_to_do
  description: The agent may finish without changes
  agent: sourcing
  seed: sourcing_demand
  subject: seed
  script:
    - kind: emit_result
      result: {outcome: nothing_to_do, summary: "No new people"}
  expect:
    status: completed
    fallback_task: false
