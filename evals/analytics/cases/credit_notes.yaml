# Epic 64 Analytics Evaluation Set -- credit_notes (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: cn_by_client
  persona: admin
  question: Credit notes by client this FY
  expected:
    definition:
      source: billing.credit_note
      filters:
        field: fiscal_year
        op: eq
        value: 26-27
      group_by:
      - field: client.name
      measures:
      - &id001
        key: n
        agg: count
      - key: total
        agg: sum
        field: inr_document_total
    viz:
      type: bar
      x: client.name
      value: total
  tags:
  - by_client
  - fy
- id: cn_by_reason
  persona: admin
  question: Credit notes by reason
  expected:
    definition:
      source: billing.credit_note
      group_by:
      - field: reason
      measures:
      - *id001
    viz:
      type: pie
      x: reason
      value: n
  tags: []
- id: cn_total_fy
  persona: admin
  question: Total credited this financial year
  expected:
    definition:
      source: billing.credit_note
      filters:
        field: doc_date
        op: between
        value:
        - '2026-04-01'
        - '2027-03-31'
      measures:
      - key: total
        agg: sum
        field: inr_document_total
    viz:
      type: kpi
      value: total
  tags:
  - fy
  - kpi
