# Epic 59 Scheduling Agent offline evals (AD-69). Subject = the Application; the seed creates the scheduling request
# (and offer / interview / reminder) without a run. The owner has no connected calendar (availability "unknown").
- id: offer_happy_path
  description: Read the interviewers, send the draft offer as the templated self-scheduling message, wait for the pick
  agent: scheduling
  seed: scheduling_draft
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.participants, {request_id: "{{request_id}}"}]]
    - kind: tool_calls
      calls: [[scheduling.offer_slots, {offer_id: "{{offer_id}}", candidate_id: "{{candidate_id}}", channel: email}]]
    - kind: await_event
      wait: {condition: slot_pick, ref: "{{offer_id}}", hours: 168, reason: waiting for the candidate}
  expect:
    status: waiting
    outcomes: {interviews.participants: executed, scheduling.offer_slots: executed}
    max_mode_by_tool: {scheduling.offer_slots: auto}
- id: unknown_calendar_availability_request
  description: An interviewer without a connected calendar gets an in-app availability request
  agent: scheduling
  seed: scheduling_draft
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.participants, {request_id: "{{request_id}}"}]]
    - kind: tool_calls
      calls: [[notify.user, {user_id: "{{owner_id}}", entity_type: application, entity_id: "{{application_id}}", message: "Please connect your calendar or confirm your availability for this interview."}]]
    - kind: emit_result
      result: {outcome: waiting, summary: asked for availability}
  expect:
    status: completed
    outcomes: {notify.user: executed}
- id: no_common_slot_partial_proposal
  description: A partial offer cannot be sent automatically; offer_partial becomes a Proposal for the recruiter
  agent: scheduling
  seed: scheduling_partial
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.participants, {request_id: "{{request_id}}"}]]
    - kind: tool_calls
      calls: [[scheduling.offer_slots, {offer_id: "{{offer_id}}", candidate_id: "{{candidate_id}}", channel: email}]]
    - kind: tool_calls
      calls: [[scheduling.offer_partial, {offer_id: "{{offer_id}}", candidate_id: "{{candidate_id}}", channel: email, note_to_recruiter: "No time has every interviewer free"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: partial options proposed}
  expect:
    status: completed
    outcomes: {scheduling.offer_slots: failed, scheduling.offer_partial: proposed}
    proposals: [scheduling.offer_partial]
- id: pick_books
  description: The candidate's pick is free at re-check and books through the P1 scheduler automatically
  agent: scheduling
  seed: scheduling_picked
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", offer_id: "{{offer_id}}"}]]
    - kind: emit_result
      result: {outcome: booked, summary: booked}
  expect:
    status: completed
    outcomes: {interviews.book: executed}
    max_mode_by_tool: {interviews.book: auto}
- id: pick_conflict_reoffer
  description: The picked time fails the re-check (outside working hours now); fresh options are computed
  agent: scheduling
  seed: scheduling_picked_conflict
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", offer_id: "{{offer_id}}"}]]
    - kind: tool_calls
      calls: [[scheduling.propose, {request_id: "{{request_id}}"}]]
    - kind: emit_result
      result: {outcome: waiting, summary: re-offered}
  expect:
    status: completed
    outcomes: {interviews.book: executed, scheduling.propose: executed}
- id: duplicate_pick_dedup
  description: Booking the same pick twice never double-books (the second call is deduplicated)
  agent: scheduling
  seed: scheduling_picked
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", offer_id: "{{offer_id}}"}]]
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", offer_id: "{{offer_id}}"}]]
    - kind: emit_result
      result: {outcome: booked, summary: booked once}
  expect:
    status: completed
    outcomes: {interviews.book: deduplicated}
- id: counter_match_books
  description: A candidate-suggested window that matches is checked and booked
  agent: scheduling
  seed: scheduling_counter
  subject: seed
  script:
    - kind: tool_calls
      calls: [[scheduling.check_times, {request_id: "{{request_id}}"}]]
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", window: {start: "{{window_start}}", end: "{{window_end}}"}}]]
    - kind: emit_result
      result: {outcome: booked, summary: booked the suggested time}
  expect:
    status: completed
    outcomes: {scheduling.check_times: executed, interviews.book: executed}
- id: counter_max_rounds_handoff
  description: No match at the maximum round hands the request to the recruiter (propose reports handed_off)
  agent: scheduling
  seed: scheduling_counter_max
  subject: seed
  script:
    - kind: tool_calls
      calls: [[scheduling.check_times, {request_id: "{{request_id}}"}]]
    - kind: tool_calls
      calls: [[scheduling.propose, {request_id: "{{request_id}}"}]]
    - kind: emit_result
      result: {outcome: handed_off, summary: handed off}
  expect:
    status: completed
    outcomes: {scheduling.check_times: executed, scheduling.propose: executed}
- id: reschedule_request
  description: A reschedule request moves the booked interview to the picked time (sequence bumped, same UID)
  agent: scheduling
  seed: scheduling_reschedule
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.reschedule, {request_id: "{{request_id}}", offer_id: "{{offer_id}}"}]]
    - kind: emit_result
      result: {outcome: booked, summary: rescheduled}
  expect:
    status: completed
    outcomes: {interviews.reschedule: executed}
- id: cancel_is_proposal
  description: Cancelling an interview is always a Proposal
  agent: scheduling
  seed: scheduling_booked
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.cancel, {interview_id: "{{interview_id}}", reason: "The panel is unavailable"}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: proposed}
  expect:
    status: completed
    outcomes: {interviews.cancel: proposed}
    proposals: [interviews.cancel]
- id: accept_conflicts_is_proposal
  description: Booking despite conflicts is high risk and becomes a Proposal
  agent: scheduling
  seed: scheduling_picked
  subject: seed
  script:
    - kind: tool_calls
      calls: [[interviews.book, {request_id: "{{request_id}}", offer_id: "{{offer_id}}", accept_conflicts: true}]]
    - kind: emit_result
      result: {outcome: needs_human, summary: proposed}
  expect:
    status: completed
    outcomes: {interviews.book: proposed}
    proposals: [interviews.book]
- id: reminders_batch
  description: A due reminder is sent once (templated); a second call is deduplicated
  agent: scheduling
  seed: scheduling_reminder
  subject: seed
  script:
    - kind: tool_calls
      calls: [[reminders.send, {reminder_id: "{{reminder_id}}"}]]
    - kind: tool_calls
      calls: [[reminders.send, {reminder_id: "{{reminder_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: reminders sent}
  expect:
    status: completed
    outcomes: {reminders.send: deduplicated}
- id: scorecard_nudges
  description: A missing scorecard nudge goes to the internal interviewer in-app
  agent: scheduling
  seed: scheduling_nudge
  subject: seed
  script:
    - kind: tool_calls
      calls: [[reminders.send, {reminder_id: "{{reminder_id}}"}]]
    - kind: emit_result
      result: {outcome: done, summary: nudged}
  expect:
    status: completed
    outcomes: {reminders.send: executed}
