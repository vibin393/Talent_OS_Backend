# Epic 77 portal Copilot Evaluation Set (vendor portal). Fake LLM scripts; run by tests/portal_copilot/test_evals_portal.py (-m evals).
- id: vendor_read_00
  who: vu_x
  question: Which releases are open for us?
  script:
  - kind: tool_calls
    calls:
    - - portal_vendor.list_releases
