# Epic 55 (A10): the extraction returns a location whose quote is absent from the email -> the field is dropped.
demand_intake_extract:
  - kind: emit_result
    result:
      roles:
        - role_index: 0
          title: {value: "Data Engineer", source_quote: "Data Engineer"}
          location: {value: "Mumbai", source_quote: "based in Mumbai"}
      client_hints: []
agent_demand:
  - kind: tool_calls
    calls: [[demands.get_intake, {message_id: "{{message_id}}"}]]
  - kind: tool_calls
    calls: [[demands.extract_intake, {message_id: "{{message_id}}"}]]
  - kind: tool_calls
    calls: [[demands.create_draft, {message_id: "{{message_id}}", role_index: 0}]]
  - kind: emit_result
    result: {outcome: done, summary: "Drafted."}
