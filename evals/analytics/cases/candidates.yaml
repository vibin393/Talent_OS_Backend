# Epic 64 Analytics Evaluation Set -- candidates (schema: id, persona, question, expected{definition+viz | clarify | unanswerable}, tolerance, tags).
- id: cd_by_source_fy
  persona: admin
  question: New candidates by source this FY
  expected:
    definition:
      source: candidates.candidate
      filters:
        field: created_at
        op: between
        value: &id001
        - '2026-04-01T00:00:00+05:30'
        - '2027-03-31T23:59:59+05:30'
      group_by:
      - field: source
    viz:
      type: bar
      x: source
  tags:
  - fy
- id: cd_by_city
  persona: admin
  question: Candidates by city
  expected:
    definition:
      source: candidates.candidate
      group_by:
      - field: city
    viz:
      type: bar
      x: city
  tags: []
- id: cd_avg_experience
  persona: admin
  question: Average experience of candidates
  expected:
    definition:
      source: candidates.candidate
      measures:
      - key: avg_exp
        agg: avg
        field: experience_years
    viz:
      type: kpi
      value: avg_exp
  tags:
  - kpi
- id: cd_relocate
  persona: admin
  question: How many candidates are willing to relocate?
  expected:
    definition:
      source: candidates.candidate
      group_by:
      - field: willing_to_relocate
    viz:
      type: pie
      x: willing_to_relocate
  tags: []
- id: cd_per_month_created
  persona: admin
  question: Candidates added per month this FY
  expected:
    definition:
      source: candidates.candidate
      filters:
        field: created_at
        op: between
        value: *id001
      group_by:
      - field: created_at
        bucket: month
    viz:
      type: line
      x: created_at
  tags:
  - fy
  - time_series
- id: cd_by_owner
  persona: admin
  question: Candidates by recruiter (owner)
  expected:
    definition:
      source: candidates.candidate
      group_by:
      - field: owner_id
    viz:
      type: bar
      x: owner_id
  tags:
  - by_recruiter
- id: cd_avg_notice
  persona: admin
  question: Average notice period by state
  expected:
    definition:
      source: candidates.candidate
      group_by:
      - field: state
      measures:
      - key: notice
        agg: avg
        field: notice_period_days
    viz:
      type: bar
      x: state
      value: notice
  tags: []
- id: cd_expected_comp_masked
  persona: recruiter
  question: Average expected compensation
  expected:
    definition:
      source: candidates.candidate
      measures:
      - key: comp
        agg: avg
        field: expected_comp_inr
    viz:
      type: kpi
      value: comp
  tags:
  - masked
  - compensation
- id: cd_age_unanswerable
  persona: admin
  question: What is the average candidate age?
  expected:
    unanswerable: true
    closest: Average experience of candidates in years
  tags:
  - unanswerable
- id: cd_available_30d
  persona: admin
  question: Candidates available in the next 30 days by city
  expected:
    definition:
      source: candidates.candidate
      filters:
        field: availability_date
        op: within_days
        value:
          days: 30
          direction: future
      group_by:
      - field: city
    viz:
      type: bar
      x: city
  tags: []
