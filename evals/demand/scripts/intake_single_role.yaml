# Epic 55 (A10): one role with quotes; the loop reads, extracts, drafts and finishes. Unknown skills become
# new-skill suggestions inside demands.create_draft (no TenantSkill is created).
demand_intake_extract:
  - kind: emit_result
    result:
      roles:
        - role_index: 0
          title: {value: "Senior Azure Data Engineer", source_quote: "Senior Azure Data Engineers"}
          positions: {value: 3, source_quote: "3 Senior Azure Data Engineers"}
          location: {value: "Pune", source_quote: "Pune hybrid"}
          work_mode: {value: "hybrid", source_quote: "Pune hybrid"}
          employment_type: {value: "contract_to_hire", source_quote: "6-month C2H"}
          pay_rate_min: {value: 1800000, source_quote: "18-22 LPA"}
          pay_rate_max: {value: 2200000, source_quote: "18-22 LPA"}
          currency: {value: "INR", source_quote: "18-22 LPA"}
          rate_unit: {value: "year", source_quote: "18-22 LPA"}
          mandatory_skills: {value: ["PySpark", "Snowpark Container Services"], source_quote: "Must have: PySpark, Snowpark Container Services"}
      client_hints: ["Acme Analytics"]
agent_demand:
  - kind: tool_calls
    calls: [[demands.get_intake, {message_id: "{{message_id}}"}]]
  - kind: tool_calls
    calls: [[demands.extract_intake, {message_id: "{{message_id}}"}]]
  - kind: tool_calls
    calls: [[demands.create_draft, {message_id: "{{message_id}}", role_index: 0}]]
  - kind: emit_result
    result: {outcome: done, summary: "Drafted one demand."}
